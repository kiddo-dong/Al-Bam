# 프론트(정적 SPA)용 nginx 설정.
#
# 백엔드(api.tothework.com)는 albam.conf가 담당한다. 같은 nginx가 Host 헤더를 보고
# 둘을 나눠 보내므로, 이 파일은 그 옆에 나란히 두면 된다.
#
# 설치 위치: /etc/nginx/sites-available/tothework-web.conf
#           → /etc/nginx/sites-enabled/ 에 심볼릭 링크
#
# 전제
#   - 빌드 결과(dist/)를 /var/www/tothework 에 올려둔다.
#   - DNS A레코드가 tothework.com, www.tothework.com 둘 다 이 서버를 가리킨다.
#     (www 레코드가 없으면 리다이렉트는커녕 접속 자체가 안 된다)
#
# 인증서 발급 (두 도메인을 한 번에)
#   sudo certbot --nginx -d tothework.com -d www.tothework.com
#   www도 함께 넣어야 한다. 리다이렉트를 하더라도 브라우저는 www에 먼저 TLS로 접속하므로,
#   www 인증서가 없으면 리다이렉트를 보기도 전에 인증서 경고가 뜬다.

# --- HTTP: 둘 다 HTTPS로 ---
server {
    listen 80;
    listen [::]:80;
    server_name tothework.com www.tothework.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS www: 대표 주소로 넘긴다 ---
#
# 주소를 하나로 모으는 이유는 취향이 아니다. www와 비-www는 브라우저에게 서로 다른 출처라
# 쿠키도 CORS 허용 목록도 따로 논다. 둘 다 살려두면 www로 들어온 사용자는 CORS에 없는
# 출처가 되어 로그인이 실패한다. 그래서 대표 주소 하나로 모으고 백엔드에는 그 하나만 알려준다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tothework.com;

    ssl_certificate     /etc/letsencrypt/live/tothework.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tothework.com/privkey.pem;

    return 301 https://tothework.com$request_uri;
}

# --- HTTPS 대표 주소: 실제 화면 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tothework.com;

    ssl_certificate     /etc/letsencrypt/live/tothework.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tothework.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # 이 사이트를 다른 사이트가 iframe으로 감싸 클릭을 가로채는 것을 막는다.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/tothework;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite가 파일명에 해시를 넣으므로 내용이 바뀌면 이름도 바뀐다. 그래서 길게 캐시해도
    # 낡은 파일이 남지 않는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 해시가 없어 이름이 그대로다. 캐시되면 배포해도 예전 화면이 계속 보이므로
    # 매번 새로 받게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 라우팅. /password-reset/confirm 같은 주소는 서버에 파일이 없고 브라우저에서
    # 라우터가 처리한다. 이 줄이 없으면 메일 링크를 눌렀을 때 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
