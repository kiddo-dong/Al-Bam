spring.application.name=albam

# DB Connection
spring.datasource.url=jdbc:mysql://localhost:3306/al-bam
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 스키마는 Flyway가 관리한다. validate는 엔티티와 실제 테이블이 어긋나면 부팅을 실패시켜,
# 마이그레이션 파일을 빼먹은 채 배포하는 사고를 막아준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# hibernate.dialect: Spring Boot 3.x는 자동 감지하므로 명시 불필요 (지정 시 deprecated 경고 발생)
# 여러 건을 한 트랜잭션에서 저장할 때(메뉴 엑셀 임포트 등) INSERT를 batch로 묶어 보낸다
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway (DB 마이그레이션)
# baseline-on-migrate: 이미 테이블이 있는 기존 DB에서는 V1을 실행하지 않고 적용된 것으로 표시한다.
# 빈 DB(새 환경·CI)에서는 V1부터 정상 실행된다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server -> 배포 시 nginx
#server.address=0.0.0.0
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

# AWS S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# Mail (Gmail SMTP) - 미설정 시 기동은 되고 메일 발송 시점에만 실패
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 메일 본문 링크에 쓰는 베이스 URL (배포 시 도메인으로 교체)
app.base-url=${APP_BASE_URL:http://127.0.0.1:8080}

# 리프레시 토큰 쿠키의 Secure 속성 - 로컬(http)은 false, 배포(https)는 반드시 true
app.cookie-secure=${COOKIE_SECURE:false}
# 쿠키 인증을 허용할 프론트 오리진 (콤마 구분, 배포 시 실제 도메인 추가)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 파일 업로드 한도 (기본값 1MB는 프로필 사진에 부족)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring AI (OpenAI) - 스케줄 초안 생성 및 근로기준법 Q&A에 사용
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# 벡터 저장소 전용 PostgreSQL (pgvector) - 근로기준법 Q&A 임베딩만 저장, 메인 데이터는 계속 MySQL 사용
app.vector-store.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/albam_vector}
app.vector-store.datasource.username=${VECTOR_DB_USERNAME:postgres}
app.vector-store.datasource.password=${VECTOR_DB_PASSWORD:}