spring.application.name=albam

# DB Connection (로컬 개발용) -> 추 후 배포용 AWS RDS 적용
spring.datasource.url=jdbc:mysql://localhost:3306/al-bam
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 스키마는 Flyway가 관리한다. validate는 엔티티와 실제 테이블이 어긋나면 부팅을 실패시켜,
# 마이그레이션 파일을 빼먹은 채 배포하는 사고를 막아준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# hibernate.dialect: Spring Boot 3.x는 자동 감지하므로 명시 불필요 (지정 시 deprecated 경고 발생)
# 여러 건을 한 트랜잭션에서 저장할 때(메뉴 엑셀 임포트 등) INSERT를 batch로 묶어 보낸다
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway (DB 마이그레이션)
# baseline-on-migrate: 이미 테이블이 있는 기존 DB에서는 V1을 실행하지 않고 적용된 것으로 표시한다.
# 빈 DB(새 환경·CI)에서는 V1부터 정상 실행된다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server -> 배포 시 nginx
#server.address=0.0.0.0
server.port=8080

# 로깅
# 기본값은 콘솔 출력뿐이라, 배포 후 터미널을 벗어나면 에러 로그가 그대로 사라진다. 파일로도 남긴다.
# EC2에서는 LOG_FILE=/var/log/albam/albam.log 처럼 절대경로를 주는 것을 권장한다.
logging.file.name=${LOG_FILE:logs/albam.log}
# 회전·보관 한도. total-size-cap이 없으면 로그만으로 EC2 디스크가 찰 수 있다.
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# 문제 추적 시 재배포 없이 올릴 수 있도록 앱 패키지 레벨만 따로 뺀다 (Actuator /loggers로도 변경 가능).
logging.level.com.example.albam=${LOG_LEVEL_APP:INFO}

# Actuator (운영 상태 조회)
# 별도 포트 + 루프백 바인딩. nginx는 8080만 프록시하므로 이 포트는 외부에서 아예 닿지 않는다.
# 서비스 API와 인증 체계가 다르므로, 네트워크로 막는 편이 권한 설계를 새로 만드는 것보다 확실하다.
# 확인 방법: EC2에 SSH로 들어가서 curl, 또는 SSH 터널.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
# loggers는 런타임 로그 레벨 변경(쓰기)이라 외부 노출 시 위험하지만, 위 루프백 제한 안에서만 열린다.
management.endpoints.web.exposure.include=health,info,metrics,loggers
# 루프백에서만 접근 가능하므로 상세(DB 연결 상태 등)를 그대로 보여준다.
management.endpoint.health.show-details=always
# 메일 헬스체크는 SMTP 접속을 시도한다. 메일은 없어도 서비스가 도는 부가 기능이라,
# 이것 때문에 전체 상태가 DOWN으로 뒤집히지 않게 제외한다.
management.health.mail.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

# AWS S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# Mail (Gmail SMTP) - 미설정 시 기동은 되고 메일 발송 시점에만 실패
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 메일 본문 링크에 쓰는 베이스 URL (배포 시 도메인으로 교체)
app.base-url=${APP_BASE_URL:http://127.0.0.1:8080}

# 리프레시 토큰 쿠키의 Secure 속성 - 로컬(http)은 false, 배포(https)는 반드시 true
app.cookie-secure=${COOKIE_SECURE:false}
# 쿠키 인증을 허용할 프론트 오리진 (콤마 구분, 배포 시 실제 도메인 추가)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 파일 업로드 한도 (기본값 1MB는 프로필 사진에 부족)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring AI (OpenAI) - 스케줄 초안 생성 및 근로기준법 Q&A에 사용
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# 벡터 저장소: S3 Vectors (근로기준법 Q&A 임베딩 전용). 원본 파일용 일반 S3 버킷과는 별개의 벡터 버킷을 쓴다.
spring.ai.vectorstore.s3.vector-bucket-name=${S3_VECTOR_BUCKET_NAME:albam-labor-qa-vectors}
spring.ai.vectorstore.s3.index-name=${S3_VECTOR_INDEX_NAME:labor-qa}

# 지식베이스 적재 API(POST /api/v1/labor-qa/admin/ingest) 호출용 토큰. 미설정 시 해당 API는 열리지 않는다.
app.admin.ingest-token=${ADMIN_INGEST_TOKEN:}