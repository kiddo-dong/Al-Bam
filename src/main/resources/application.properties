spring.application.name=albam

# DB Connection (로컬 개발용) -> 추 후 배포용 AWS RDS 적용
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/al-bam}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 스키마는 Flyway가 관리한다. validate는 엔티티와 실제 테이블이 어긋나면 부팅을 실패시켜,
# 마이그레이션 파일을 빼먹은 채 배포하는 사고를 막아준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# OSIV를 끈다. 켜 두면 Hibernate가 한 번 잡은 DB 커넥션을 요청이 끝날 때까지 쥐고 있는다
# (DELAYED_ACQUISITION_AND_HOLD). 메일·S3·OpenAI 호출을 트랜잭션 밖으로 빼놓은 곳에서도, 그 앞에서
# 권한 확인으로 커넥션을 한 번 잡으면 외부 응답을 기다리는 몇 초 내내 풀에서 하나가 빠진다.
# 풀이 10개라 AI 상담 몇 건만 겹쳐도 다른 요청이 줄을 선다.
# 끄면 트랜잭션 밖에서 지연 로딩을 하면 LazyInitializationException이 난다. 응답 DTO는 서비스
# 트랜잭션 안에서 만든다는 이 프로젝트의 규칙을 지키면 문제없다.
spring.jpa.open-in-view=false

# hibernate.dialect: Spring Boot 3.x는 자동 감지하므로 명시 불필요 (지정 시 deprecated 경고 발생)
# 여러 건을 한 트랜잭션에서 저장할 때(메뉴 엑셀 임포트 등) INSERT를 batch로 묶어 보낸다
spring.jpa.properties.hibernate.jdbc.batch_size=30
# 지연 로딩이 필요해졌을 때 한 건씩 채우지 않고 아직 안 읽은 것들을 모아 IN 한 번으로 가져온다.
# 목록 N건이 N번 조회되던 것이 1~2번으로 줄어든다. @EntityGraph는 어떤 연관을 함께 읽을지 쿼리마다
# 정하는 것이고, 이 설정은 그러지 못한 나머지(특히 @ElementCollection)를 받쳐주는 안전망이다.
# 컬렉션을 @EntityGraph로 조인하면 행이 곱해져 중복이 생기므로, 컬렉션은 이쪽에 맡기는 편이 낫다.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway (DB 마이그레이션)
# baseline-on-migrate: 이미 테이블이 있는 기존 DB에서는 V1을 실행하지 않고 적용된 것으로 표시한다.
# 빈 DB(새 환경·CI)에서는 V1부터 정상 실행된다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server -> 배포 시 nginx
# 루프백에만 바인딩한다. nginx가 유일한 입구이므로 8080이 외부에 직접 노출될 이유가 없고,
# 보안그룹 설정이 잘못되더라도 OS 레벨에서 한 번 더 막힌다(관리 포트와 같은 정책).
# 컨테이너나 로드밸런서 뒤로 옮겨 외부에서 직접 닿아야 할 때만 이 값을 바꾼다.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# 리버스 프록시(nginx) 뒤에서 실행될 때, 원래 요청이 HTTPS였고 클라이언트 IP가 무엇이었는지는
# nginx가 넘겨주는 X-Forwarded-* 헤더에만 남는다. 이 설정이 없으면 앱은 모든 요청을
# "127.0.0.1에서 온 평문 HTTP"로 보고, 그 결과
#   - Secure 쿠키를 내보내지 않아 로그인이 통째로 깨지고 (COOKIE_SECURE=true일 때)
#   - 리다이렉트 URL이 http:// 로 만들어지며
#   - 요청자 IP가 전부 nginx IP로 뭉개진다
# 클라이언트가 보낸 헤더를 믿는 설정이지만, Tomcat이 사설 대역(127.0.0.0/8, 10/8, 192.168/16 등)에서
# 들어온 요청의 헤더만 신뢰하므로 외부에서 X-Forwarded-Proto를 위조해 보내도 무시된다.
# 그래도 8080은 보안그룹에서 외부에 열지 말고 nginx만 붙도록 두는 것이 맞다.
# 로컬에서는 이 헤더를 보내는 주체가 없어 아무 영향이 없다.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}

# 로깅
# 기본값은 콘솔 출력뿐이라, 배포 후 터미널을 벗어나면 에러 로그가 그대로 사라진다. 파일로도 남긴다.
# EC2에서는 LOG_FILE=/var/log/albam/albam.log 처럼 절대경로를 주는 것을 권장한다.
logging.file.name=${LOG_FILE:logs/albam.log}
# 회전·보관 한도. total-size-cap이 없으면 로그만으로 EC2 디스크가 찰 수 있다.
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# 문제 추적 시 재배포 없이 올릴 수 있도록 앱 패키지 레벨만 따로 뺀다 (Actuator /loggers로도 변경 가능).
logging.level.com.example.albam=${LOG_LEVEL_APP:INFO}

# Actuator (운영 상태 조회)
# 별도 포트 + 루프백 바인딩. nginx는 8080만 프록시하므로 이 포트는 외부에서 아예 닿지 않는다.
# 서비스 API와 인증 체계가 다르므로, 네트워크로 막는 편이 권한 설계를 새로 만드는 것보다 확실하다.
# 확인 방법: EC2에 SSH로 들어가서 curl, 또는 SSH 터널.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
# loggers는 런타임 로그 레벨 변경(쓰기)이라 외부 노출 시 위험하지만, 위 루프백 제한 안에서만 열린다.
management.endpoints.web.exposure.include=health,info,metrics,loggers
# 루프백에서만 접근 가능하므로 상세(DB 연결 상태 등)를 그대로 보여준다.
management.endpoint.health.show-details=always

# API 문서 (Swagger)
# 기본을 꺼 둔다. 켜져 있으면 인증 없이 전체 엔드포인트·파라미터·DTO 구조가 그대로 공개되는데,
# 배포에서 끄는 걸 잊는 쪽이 로컬에서 켜는 걸 잊는 것보다 훨씬 비싸다. 그래서 안전한 쪽을 기본으로 둔다.
# 로컬에서 문서를 볼 때만 SWAGGER_ENABLED=true로 띄운다.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# 메일 헬스체크는 SMTP 접속을 시도한다. 메일은 없어도 서비스가 도는 부가 기능이라,
# 이것 때문에 전체 상태가 DOWN으로 뒤집히지 않게 제외한다.
management.health.mail.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
# 액세스 토큰은 짧게 간다. 리프레시 토큰이 상태 없는 JWT라 서버가 토큰을 폐기할 수단이
# 없기 때문에(로그아웃도 쿠키만 지운다), 유출됐을 때 노출되는 시간을 만료로만 줄일 수 있다.
# 프론트가 401을 받으면 자동으로 갱신하고 동시 요청도 한 번으로 묶으므로 사용자는 체감하지 못한다.
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=1209600000

# AWS S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# Mail (Gmail SMTP) - 미설정 시 기동은 되고 메일 발송 시점에만 실패
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 메일 본문 링크에 쓰는 베이스 URL (배포 시 도메인으로 교체)
app.base-url=${APP_BASE_URL:http://127.0.0.1:8080}
# 메일 안의 링크가 향할 사용자용 주소. 위 base-url은 API 주소라 사용자가 열면 JSON이나 405가 보인다.
# 끝에 슬래시를 붙이지 말 것. 예: https://tothework.com
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# 리프레시 토큰 쿠키의 Secure 속성 - 로컬(http)은 false, 배포(https)는 반드시 true
app.cookie-secure=${COOKIE_SECURE:false}
# 쿠키 인증을 허용할 프론트 오리진 (콤마 구분, 배포 시 실제 도메인 추가)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 파일 업로드 한도 (기본값 1MB는 프로필 사진에 부족)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring AI (OpenAI) - 스케줄 초안 생성 및 근로기준법 Q&A에 사용
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# 벡터 저장소 전용 PostgreSQL (pgvector) - 근로기준법 Q&A 임베딩만 저장, 메인 데이터는 계속 MySQL 사용.
# 메인 DB와 엔진이 달라 같은 인스턴스에 얹을 수 없으므로 별도 인스턴스를 쓴다.
app.vector-store.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/albam_vector}
app.vector-store.datasource.username=${VECTOR_DB_USERNAME:albam_app}
app.vector-store.datasource.password=${VECTOR_DB_PASSWORD:}

# 근로기준법 Q&A 검색 범위.
# similarity-threshold를 넘는 문서가 하나도 없으면 LLM을 부르지 않고 "자료가 없다"로 답한다.
# 높이면 엉뚱한 답을 막지만, 자료에 있는 내용도 질문을 다르게 표현했다는 이유로 걸러진다.
# 낮추면 관련이 옅은 문서까지 근거로 넘어가는 대신, 그걸로 답할지는 LLM이 한 번 더 판단한다.
# 실제 질문을 받아보며 맞추는 값이라 재빌드 없이 조정할 수 있게 빼 두었다.
app.labor-qa.similarity-threshold=${LABOR_QA_SIMILARITY_THRESHOLD:0.28}
app.labor-qa.top-k=${LABOR_QA_TOP_K:5}

# 지식베이스 적재 API(POST /api/v1/labor-qa/admin/ingest) 호출용 토큰. 미설정 시 해당 API는 열리지 않는다.
app.admin.ingest-token=${ADMIN_INGEST_TOKEN:}
